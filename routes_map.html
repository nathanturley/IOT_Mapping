    <style>#loginModal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.95);
  z-index: 99999;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

#loginBox {
  background: white;
  padding: 40px;
  border-radius: 12px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
  max-width: 400px;
  width: 90%;
}

#loginBox h2 {
  margin: 0 0 10px 0;
  color: #333;
  font-size: 24px;
}

#loginBox p {
  margin: 0 0 20px 0;
  color: #666;
  font-size: 14px;
}

#loginBox input[type="password"] {
  width: 100%;
  padding: 12px;
  border: 2px solid #ddd;
  border-radius: 6px;
  font-size: 16px;
  box-sizing: border-box;
  margin-bottom: 10px;
}

#loginBox input[type="password"]:focus {
  outline: none;
  border-color: #4CAF50;
}

#loginBox button {
  width: 100%;
  padding: 12px;
  background: #4CAF50;
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
}

#loginBox button:hover {
  background: #45a049;
}

#loginBox .remember-me {
  margin: 15px 0;
  display: flex;
  align-items: center;
  font-size: 14px;
  color: #666;
}

#loginBox .remember-me input {
  margin-right: 8px;
}

#loginError {
  color: #d32f2f;
  font-size: 14px;
  margin-top: 10px;
  display: none;
}

#logoutBtn {
  position: absolute;
  top: 10px;
  left: 50px;
  z-index: 1000;
  background: #f44336;
  color: white;
  border: none;
  padding: 8px 16px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
}

#logoutBtn:hover {
  background: #d32f2f;
}

#timestampContainer {
  position: absolute;
  top: 10px;
  right: 280px;
  z-index: 1000;
  background: white;
  padding: 8px 12px;
  border-radius: 4px;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
  font-size: 12px;
  display: flex;
  align-items: center;
  height: 32px;
  box-sizing: border-box;
}

#timestampContainer strong {
  margin-right: 6px;
}

#searchContainer {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 1000;
  background: white;
  padding: 8px;
  border-radius: 4px;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
  max-height: 260px;
  width: 260px;
  overflow: hidden;
  font-size: 12px;
}

#nodeSearch {
  width: 100%;
  box-sizing: border-box;
  padding: 4px 6px;
  margin-bottom: 4px;
  border: 1px solid #ccc;
  border-radius: 3px;
}

#searchResults {
  max-height: 210px;
  overflow-y: auto;
}

.search-result {
  padding: 3px 4px;
  cursor: pointer;
  border-radius: 3px;
  border-bottom: 1px solid #eee;
}

.search-result:hover {
  background: #f0f0f0;
}

#offlineContainer {
  position: absolute;
  bottom: 30px;
  left: 10px;
  z-index: 1000;
  background: white;
  padding: 10px;
  border-radius: 4px;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
  max-height: 400px;
  width: 280px;
  overflow: hidden;
  font-size: 12px;
}

#offlineContainer h4 {
  margin: 0 0 8px 0;
  font-size: 13px;
  font-weight: bold;
  color: #d32f2f;
}

#offlineList {
  max-height: 380px;
  overflow-y: auto;
}

.offline-item {
  padding: 6px 8px;
  cursor: pointer;
  border-radius: 3px;
  border-bottom: 1px solid #eee;
  margin-bottom: 2px;
}

.offline-item:hover {
  background: #ffebee;
}

.offline-name {
  font-weight: 500;
  color: #333;
}

.offline-id {
  font-size: 11px;
  color: #666;
  margin-top: 2px;
}

#legend {
  position: absolute;
  bottom: 30px;
  right: 10px;
  z-index: 1000;
  background: white;
  padding: 10px;
  border-radius: 4px;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
  font-size: 12px;
  line-height: 1.6;
}

#legend h4 {
  margin: 0 0 8px 0;
  font-size: 13px;
  font-weight: bold;
}

.legend-item {
  display: flex;
  align-items: center;
  margin-bottom: 4px;
}

.legend-icon {
  width: 20px;
  height: 20px;
  margin-right: 8px;
  border-radius: 2px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  color: white;
}

.legend-icon.purple { background-color: #cf51b6; }
.legend-icon.pink   { background-color: #ff91e8; }
.legend-icon.blue   { background-color: #38a9dc; }
.legend-icon.green  { background-color: #71af26; }
</style>
<div id="loginModal" style="display: none;">
  <div id="loginBox">
    <h2>Map Authentication</h2>
    <p>Please enter the password to view this map.</p>
    <input type="password" id="mapPassword" placeholder="Enter password" autocomplete="off" />
    <div class="remember-me">
      <input type="checkbox" id="rememberMe" />
      <label for="rememberMe">Remember me on this device</label>
    </div>
    <button onclick="attemptLogin()">Login</button>
    <div id="loginError">Incorrect password. Please try again.</div>
  </div>
</div>

<button id="logoutBtn" style="display: none;" onclick="logout()">Logout</button>

<div id="timestampContainer">
  <strong>Last Updated:</strong>
  <span id="lastUpdated"></span>
</div>

<div id="searchContainer">
  <input id="nodeSearch" type="text"
         placeholder="Search by ID, name, location" />
  <div id="searchResults"></div>
</div>

<div id="offlineContainer">
  <h4>Offline Nodes</h4>
  <div id="offlineList"></div>
</div>

<div id="legend">
  <h4>Legend</h4>
  <div class="legend-item">
    <div class="legend-icon purple"><i class="fa fa-cloud"></i></div>
    <span>Gateways</span>
  </div>
  <div class="legend-item">
    <div class="legend-icon pink"><i class="fa fa-exchange"></i></div>
    <span>Repeaters</span>
  </div>
  <div class="legend-item">
    <div class="legend-icon blue"><i class="fa fa-tint"></i></div>
    <span>Water Tanks</span>
  </div>
  <div class="legend-item">
    <div class="legend-icon green"><i class="fa fa-tint"></i></div>
    <span>Stream Sensors</span>
  </div>
</div>

/**
 * Reverse the Python XOR obfuscation.
 * Decodes base64, then XORs each byte with the cycling password.
 */
function deobfuscate(base64Data, password) {
  var encrypted = atob(base64Data);
  var encoder = new TextEncoder();
  var keyBytes = encoder.encode(password);

  var decrypted = "";
  for (var i = 0; i < encrypted.length; i++) {
    decrypted += String.fromCharCode(encrypted.charCodeAt(i) ^ keyBytes[i % keyBytes.length]);
  }
  return decrypted;
}

    initializeMap();
  } catch (e) {
    errorDiv.textContent = "Incorrect password. Please try again.";
    errorDiv.style.display = "block";
    document.getElementById("mapPassword").value = "";
    document.getElementById("mapPassword").focus();
  }
}

function logout() {
  localStorage.removeItem("mapAuth");
  sessionStorage.removeItem("mapAuth");
  location.reload();
}

// Submit password on Enter key
document.addEventListener("DOMContentLoaded", function () {
  var passwordInput = document.getElementById("mapPassword");
  if (passwordInput) {
    passwordInput.addEventListener("keypress", function (e) {
      if (e.key === "Enter") attemptLogin();
    });
  }
});

/**
 * On page load: try to auto-login from a stored session,
 * show the login modal if encrypted, or load data directly if not.
 */
function checkAuth() {
  var storedAuth = localStorage.getItem("mapAuth") || sessionStorage.getItem("mapAuth");

  // Try auto-login with previously stored password
  if (storedAuth && isEncrypted) {
    try {
      var password = atob(storedAuth);
      devices = JSON.parse(deobfuscate(encryptedDevices, password));
      edges = JSON.parse(deobfuscate(encryptedEdges, password));

      document.getElementById("logoutBtn").style.display = "block";
      initializeMap();
      return;
    } catch (e) {
      // Stored password is stale — clear it and show login
      localStorage.removeItem("mapAuth");
      sessionStorage.removeItem("mapAuth");
    }
  }

  if (isEncrypted) {
    // Show login modal
    document.getElementById("loginModal").style.display = "flex";
    setTimeout(function () {
      document.getElementById("mapPassword").focus();
    }, 100);
  } else {
    // No encryption — parse data directly
    devices = JSON.parse(encryptedDevices);
    edges = JSON.parse(encryptedEdges);
    initializeMap();
  }
}

// ===========================================================================
// Map initialisation — edges, markers, click handlers
// ===========================================================================

function initializeMap() {
  // Folium creates the map asynchronously — wait until it's ready
  var mapContainer = document.querySelector(".folium-map");
  if (!mapContainer || !window[mapContainer.id]) {
    setTimeout(initializeMap, 100);
    return;
  }

  mapObj = window[mapContainer.id];

  // Build a quick-lookup set of offline node IDs
  var offlineNodeIdsSet = new Set();
  offlineNodeIds.forEach(function (id) {
    offlineNodeIdsSet.add(id.toUpperCase());
  });

  // --- Draw edges (lines between nodes) ---

  var edgesByNode = {};  // nodeId -> [lines connected to that node]
  var allEdges = [];
  var maxEdgeCount = 0;

  // Find the highest edge count (used to scale line thickness)
  edges.forEach(function (e) {
    if (typeof e.count === "number" && e.count > maxEdgeCount) {
      maxEdgeCount = e.count;
    }
  });
  if (maxEdgeCount < 1) maxEdgeCount = 1;

  // Scale line weight logarithmically so high-count edges don't dominate
  function weightForCount(c) {
    c = c || 1;
    if (maxEdgeCount <= 1) return 2;
    return 1 + 4 * (Math.log(1 + c) / Math.log(1 + maxEdgeCount));
  }

  edges.forEach(function (e) {
    var w = weightForCount(e.count);
    var isOfflineEdge = offlineNodeIdsSet.has(e.frm) || offlineNodeIdsSet.has(e.to);

    var line = L.polyline(
      [[e.lat_from, e.lon_from], [e.lat_to, e.lon_to]],
      {
        color: "#3388ff",
        weight: w,
        opacity: isOfflineEdge ? 0 : 0.5,  // Hide edges to offline nodes
      }
    );

    // Store metadata on the line for highlighting later
    line.baseWeight = w;
    line.fromId = e.frm;
    line.toId = e.to;
    line.isOfflineEdge = isOfflineEdge;

    allEdges.push(line);

    // Index edges by both endpoints so we can highlight all edges for a device
    if (!edgesByNode[e.frm]) edgesByNode[e.frm] = [];
    if (!edgesByNode[e.to]) edgesByNode[e.to] = [];
    edgesByNode[e.frm].push(line);
    edgesByNode[e.to].push(line);

    line.addTo(mapObj);
  });

  // --- Connect Folium markers to our click handler ---
  // Folium markers don't carry custom data, so we map lat/lng back to device ID
  var coordToDeviceId = {};
  devices.forEach(function (d) {
    if (d.Latitude && d.Longitude) {
      var key = d.Latitude.toFixed(6) + "," + d.Longitude.toFixed(6);
      coordToDeviceId[key] = d.ID_upper;
    }
  });

  mapObj.eachLayer(function (layer) {
    if (layer instanceof L.Marker) {
      layer.on("click", function () {
        var lat = this.getLatLng().lat.toFixed(6);
        var lng = this.getLatLng().lng.toFixed(6);
        var deviceId = coordToDeviceId[lat + "," + lng];
        if (deviceId) highlightDevice(deviceId);
      });
    }
  });

  // --- Edge highlighting (click a device to see its connections) ---

  var selectedId = null;

  function resetHighlight() {
    allEdges.forEach(function (line) {
      line.setStyle({
        color: "#3388ff",
        opacity: line.isOfflineEdge ? 0 : 0.5,
        weight: line.baseWeight,
      });
    });
    selectedId = null;
  }

  function highlightDevice(idUpper) {
    // Toggle off if clicking the same device again
    if (selectedId === idUpper) {
      resetHighlight();
      return;
    }

    resetHighlight();
    selectedId = idUpper;

    // Highlight all edges connected to this device
    var lines = edgesByNode[idUpper] || [];
    lines.forEach(function (line) {
      line.setStyle({ color: "#000000", opacity: 0.9 });
    });
  }

  function focusOnDevice(idUpper) {
    var device = null;
    for (var i = 0; i < devices.length; i++) {
      if (devices[i].ID_upper === idUpper) {
        device = devices[i];
        break;
      }
    }
    if (device && device.Latitude && device.Longitude) {
      mapObj.setView([device.Latitude, device.Longitude], Math.max(mapObj.getZoom(), 13));
      highlightDevice(idUpper);
    }
  }

  // ===========================================================================
  // Search — filter devices by ID, name, or location
  // ===========================================================================

  var searchInput = document.getElementById("nodeSearch");
  var resultsDiv = document.getElementById("searchResults");

  /** Build a search result label using safe DOM methods (no innerHTML with user data). */
  function buildLabelElement(d) {
    var container = document.createElement("span");
    container.appendChild(document.createTextNode(d.DeviceName || d.ID));
    if (d.Location) {
      container.appendChild(document.createTextNode(" — " + d.Location));
    }
    container.appendChild(document.createElement("br"));
    container.appendChild(document.createTextNode("ID: " + d.ID));
    return container;
  }

  function renderResults(matches) {
    resultsDiv.innerHTML = "";
    matches.slice(0, 50).forEach(function (d) {
      var div = document.createElement("div");
      div.className = "search-result";
      div.appendChild(buildLabelElement(d));
      div.onclick = function () { focusOnDevice(d.ID_upper); };
      resultsDiv.appendChild(div);
    });
  }

  function filterDevices(query) {
    var q = (query || "").trim().toLowerCase();
    if (!q) {
      resultsDiv.innerHTML = "";
      resetHighlight();
      return;
    }

    var matches = [];
    devices.forEach(function (d) {
      var haystack = (d.ID + " " + (d.DeviceName || "") + " " + (d.Location || "")).toLowerCase();
      if (haystack.indexOf(q) !== -1) matches.push(d);
    });
    renderResults(matches);
  }

  searchInput.addEventListener("input", function () {
    filterDevices(this.value);
  });

  // ===========================================================================
  // Offline nodes panel
  // ===========================================================================

  var offlineListDiv = document.getElementById("offlineList");

  function renderOfflineNodes() {
    offlineListDiv.innerHTML = "";

    if (!offlineNodes || offlineNodes.length === 0) {
      offlineListDiv.innerHTML = '<div style="color: #999; padding: 4px;">No offline nodes</div>';
      return;
    }

    offlineNodes.forEach(function (node) {
      var name = node[0];
      var nodeId = node[1];

      var div = document.createElement("div");
      div.className = "offline-item";

      var nameDiv = document.createElement("div");
      nameDiv.className = "offline-name";
      nameDiv.textContent = name;

      var idDiv = document.createElement("div");
      idDiv.className = "offline-id";
      idDiv.textContent = "Node ID: " + nodeId;

      div.appendChild(nameDiv);
      div.appendChild(idDiv);

      div.onclick = function () {
        focusOnDevice(nodeId.toUpperCase().trim());
      };

      offlineListDiv.appendChild(div);
    });
  }

  renderOfflineNodes();

  // ===========================================================================
  // Timestamp — show when the offline data was last scraped
  // ===========================================================================

  var scrapeTime = new Date("2026-07-02T07:17:55.194795+12:00");
  var formatted = scrapeTime.toLocaleString("en-NZ", {
    timeZone: "Pacific/Auckland",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    hour12: false,
  });
  document.getElementById("lastUpdated").textContent = formatted;
}

// ===========================================================================
// Bootstrap — kick off auth check when the page is ready
// ===========================================================================

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", checkAuth);
} else {
  checkAuth();
}
</script>
