<style>
  #loginModal {
    position: fixed;
    top: 0;
    left: 0;

  }
  #loginBox {
    background: white;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    max-width: 400px;
    width: 90%;
  }
  #loginBox h2 {
    margin: 0 0 10px 0;
    color: #333;
    font-size: 24px;
  }

    margin: 0 0 20px 0;
    color: #666;
    font-size: 14px;
  }
  #loginBox input[type="password"] {
    width: 100%;
    padding: 12px;
    border: 2px solid #ddd;
    border-radius: 6px;
    font-size: 16px;

    margin-bottom: 10px;

  #loginBox input[type="password"]:focus {
    outline: none;
    border-color: #4CAF50;
  }
  #loginBox button {
    width: 100%;
    padding: 12px;
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;

  #loginBox button:hover {
    background: #45a049;
  }
  #loginBox .remember-me {
    margin: 15px 0;
    display: flex;
    align-items: center;
    font-size: 14px;
    color: #666;

  #loginBox .remember-me input {

    color: #d32f2f;

    margin-top: 10px;

    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;

    background: #d32f2f;
  }

    position: absolute;
    top: 10px;
    right: 280px;
    z-index: 1000;
    background: white;
    padding: 8px 12px;
    border-radius: 4px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);

    align-items: center;
    height: 32px;

  }
  #searchContainer {

    top: 10px;
    right: 10px;
    z-index: 1000;
    background: white;

  #legend {

  .legend-item {

  .legend-icon.blue { background-color: #38a9dc;  }
  .legend-icon.green { background-color: #71af26; }

  function deobfuscate(base64Data, password) {
    try {
      // Decode base64
      let encrypted = atob(base64Data);
      
      // Convert password to bytes
      let encoder = new TextEncoder();
      let keyBytes = encoder.encode(password);
      
      // XOR decrypt
      let decrypted = '';
      for (let i = 0; i < encrypted.length; i++) {
        // XOR with cycling password bytes
        let decryptedByte = encrypted.charCodeAt(i) ^ keyBytes[i % keyBytes.length];
        decrypted += String.fromCharCode(decryptedByte);
      }
      
      return decrypted;
    } catch (e) {
      throw new Error('Decryption failed');
    }
  }

      let storage = remember ? localStorage : sessionStorage;
      storage.setItem('mapAuth', authToken);
      
      // Hide login modal
