<style>
  #loginModal {
    position: fixed;
    top: 0;
    left: 0;

  #loginBox {
    background: white;

    box-shadow: 0 10px 40px rgba(0,0,0,0.3);

    width: 90%;
  }
  #loginBox h2 {
    margin: 0 0 10px 0;
    color: #333;
    font-size: 24px;
  }

    margin: 0 0 20px 0;
    color: #666;
    font-size: 14px;
  }
  #loginBox input[type="password"] {
    width: 100%;
    padding: 12px;
    border: 2px solid #ddd;
    border-radius: 6px;

    outline: none;
    border-color: #4CAF50;
  }
  #loginBox button {
    width: 100%;
    padding: 12px;
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;

  }
  #loginBox .remember-me {

    display: flex;
    align-items: center;

    color: #666;

    background: #d32f2f;
  }

    position: absolute;
    top: 10px;
    right: 280px;
    z-index: 1000;
    background: white;
    padding: 8px 12px;
    border-radius: 4px;

    align-items: center;
    height: 32px;

  #searchContainer {

    top: 10px;
    right: 10px;
    z-index: 1000;

  .legend-icon.green { background-color: #71af26; }

  // XOR decryption function (reverse of Python obfuscation)
  function deobfuscate(base64Data, password) {
    try {
      // Decode base64
      let encrypted = atob(base64Data);
      
      // Convert password to bytes
      let encoder = new TextEncoder();
      let keyBytes = encoder.encode(password);
      
      // XOR decrypt
      let decrypted = '';
      for (let i = 0; i < encrypted.length; i++) {
        // XOR with cycling password bytes
        let decryptedByte = encrypted.charCodeAt(i) ^ keyBytes[i % keyBytes.length];
        decrypted += String.fromCharCode(decryptedByte);
      }
      
      return decrypted;
    } catch (e) {
      throw new Error('Decryption failed');
    }
  }

      errorDiv.style.display = 'block';
      return;

      edges = JSON.parse(edgesJson);
      
      // Success! Store auth token
      let authToken = btoa(password);
      let storage = remember ? localStorage : sessionStorage;
      storage.setItem('mapAuth', authToken);
      
      // Hide login modal
      document.getElementById('loginModal').style.display = 'none';
      
      // Show logout button
      document.getElementById('logoutBtn').style.display = 'block';

  function weightForCount(c) {

    line.baseWeight = w;
