<style>
  #loginModal {
    position: fixed;
    top: 0;
    left: 0;

    align-items: center;
    justify-content: center;

  }
  #loginBox {
    background: white;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    max-width: 400px;
    width: 90%;
  }
  #loginBox h2 {
    margin: 0 0 10px 0;
    color: #333;
    font-size: 24px;
  }
  #loginBox p {
    margin: 0 0 20px 0;
    color: #666;
    font-size: 14px;
  }
  #loginBox input[type="password"] {
    width: 100%;
    padding: 12px;
    border: 2px solid #ddd;
    border-radius: 6px;
    font-size: 16px;

    margin-bottom: 10px;
  }
  #loginBox input[type="password"]:focus {
    outline: none;
    border-color: #4CAF50;
  }
  #loginBox button {
    width: 100%;
    padding: 12px;
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
    font-weight: 600;

  #loginBox button:hover {
    background: #45a049;
  }
  #loginBox .remember-me {
    margin: 15px 0;
    display: flex;
    align-items: center;
    font-size: 14px;
    color: #666;
  }
  #loginBox .remember-me input {
    margin-right: 8px;

    color: #d32f2f;

    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;

    background: #d32f2f;
  }

    position: absolute;
    top: 10px;
    right: 280px;
    z-index: 1000;
    background: white;
    padding: 8px 12px;
    border-radius: 4px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);

    align-items: center;
    height: 32px;
    box-sizing: border-box;
  }

  }
  #searchContainer {

    top: 10px;
    right: 10px;
    z-index: 1000;
    background: white;

    border-radius: 4px;

  }
  .offline-id {

    color: #666;

  #legend {

    bottom: 30px;

  .legend-item {

    align-items: center;

  .legend-icon.blue { background-color: #38a9dc;  }
  .legend-icon.green { background-color: #71af26; }

  // XOR decryption function (reverse of Python obfuscation)
  function deobfuscate(base64Data, password) {
    try {
      // Decode base64
      let encrypted = atob(base64Data);
      
      // Convert password to bytes
      let encoder = new TextEncoder();
      let keyBytes = encoder.encode(password);
      
      // XOR decrypt
      let decrypted = '';
      for (let i = 0; i < encrypted.length; i++) {
        // XOR with cycling password bytes
        let decryptedByte = encrypted.charCodeAt(i) ^ keyBytes[i % keyBytes.length];
        decrypted += String.fromCharCode(decryptedByte);
      }
      
      return decrypted;
    } catch (e) {
      throw new Error('Decryption failed');
    }
  }

      // Hide login modal

  });
  if (maxEdgeCount < 1) { maxEdgeCount = 1; }

  function weightForCount(c) {
    c = c || 1;
    if (maxEdgeCount <= 1) { return 2; }
    return 1 + 4 * (Math.log(1 + c) / Math.log(1 + maxEdgeCount));
  }

  function buildLabel(d) {

    var line = L.polyline(

      {

      }
    );
    line.baseWeight = w;
    line.fromId = e.frm;
    line.toId = e.to;
    line.isOfflineEdge = isOfflineEdge;
    allEdges.push(line);
    if (!edgesByNode[e.frm]) { edgesByNode[e.frm] = []; }
