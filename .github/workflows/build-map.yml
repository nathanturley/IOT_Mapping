name: Build routes map

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (UTC)
  workflow_dispatch: {}       # allow manual runs from Actions tab

permissions:
  contents: write             # allow pushing changes back to the repo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Check out data from private repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DATA_REPO_PAT }}
          path: data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chrome and chromedriver
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Set Chrome environment variables
        run: |
          echo "CHROME_BIN=/usr/bin/google-chrome" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download CSV files from private repo
        run: |
          # Download CSV files using raw.githubusercontent.com
          # Replace YOUR_USERNAME and YOUR_PRIVATE_REPO with your actual values
          PRIVATE_REPO="nathanturley/IOT_Mapping_Data"
          BRANCH="main"
          
          curl -H "Authorization: token ${{ secrets.DATA_REPO_PAT }}" \
            -H "Accept: application/vnd.github.v3.raw" \
            -L "https://api.github.com/repos/$PRIVATE_REPO/contents/paths.csv?ref=$BRANCH" \
            -o paths.csv
          
          curl -H "Authorization: token ${{ secrets.DATA_REPO_PAT }}" \
            -H "Accept: application/vnd.github.v3.raw" \
            -L "https://api.github.com/repos/$PRIVATE_REPO/contents/devices.csv?ref=$BRANCH" \
            -o devices.csv
          
          curl -H "Authorization: token ${{ secrets.DATA_REPO_PAT }}" \
            -H "Accept: application/vnd.github.v3.raw" \
            -L "https://api.github.com/repos/$PRIVATE_REPO/contents/labels.csv?ref=$BRANCH" \
            -o labels.csv
          
          echo "CSV files downloaded successfully"
          ls -lh *.csv

      - name: Run main script to generate routes_map.html
        env:
          MAP_PASSWORD: ${{ secrets.MAP_PASSWORD }}
        run: |
          python map_paths_v2.py \
            --paths paths.csv \
            --devices devices.csv \
            --labels labels.csv \
            --out routes_map.html \
            --password "$MAP_PASSWORD"

      - name: Commit and push routes_map.html if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only add/commit if the file actually changed
          if git status --porcelain routes_map.html | grep .; then
            git add routes_map.html
            git commit -m "Update routes_map.html"
            git push
          else
            echo "No changes to routes_map.html"
          fi
