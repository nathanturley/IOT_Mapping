name: Build and deploy routes map

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Chrome
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Set Chrome environment variables
        run: echo "CHROME_BIN=/usr/bin/google-chrome" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download CSV files from private repo
        run: |
          PRIVATE_REPO="nathanturley/IOT_Mapping_Data"
          BRANCH="main"

          curl -H "Authorization: token ${{ secrets.DATA_REPO_PAT }}" \
            -H "Accept: application/vnd.github.v3.raw" \
            -L "https://api.github.com/repos/$PRIVATE_REPO/contents/paths.csv?ref=$BRANCH" \
            -o paths.csv

          curl -H "Authorization: token ${{ secrets.DATA_REPO_PAT }}" \
            -H "Accept: application/vnd.github.v3.raw" \
            -L "https://api.github.com/repos/$PRIVATE_REPO/contents/devices.csv?ref=$BRANCH" \
            -o devices.csv

          curl -H "Authorization: token ${{ secrets.DATA_REPO_PAT }}" \
            -H "Accept: application/vnd.github.v3.raw" \
            -L "https://api.github.com/repos/$PRIVATE_REPO/contents/labels.csv?ref=$BRANCH" \
            -o labels.csv

          echo "CSV files downloaded successfully"
          ls -lh *.csv

      - name: Generate map
        env:
          MAP_PASSWORD: ${{ secrets.MAP_PASSWORD }}
          PYTHONPATH: src
          CI: "true"
        run: |
          python -m iot_mapping \
            --paths paths.csv \
            --devices devices.csv \
            --labels labels.csv \
            --out output/routes_map.html \
            --password "$MAP_PASSWORD"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
